name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests
        run: ./gradlew :shared:testAndroidHostTest --console=plain
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-beats-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk

  ios:
    name: iOS (framework + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build iOS framework (simulator)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
      - name: iOS tests (simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain
      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: Shared-iosSimulatorArm64
          path: shared/build/bin/iosSimulatorArm64/debugFramework
